name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # ONLY FOR PULL REQUESTS, and the difference matters for one of the two
  # groups this expression produces. A pull request run is keyed on
  # `refs/pull/N/merge`, so a new push supersedes an older run of the same
  # PR — which is what you want. A push to main is keyed on
  # `refs/heads/main` for the WHOLE BRANCH, so merging a second pull request
  # inside the browser job's twelve minutes would cancel the first commit's
  # verification and nothing would ever re-run it: a commit on main with no
  # verdict, and no record saying so.
  #
  # Measured before changing it: of 71 push-to-main runs, 0 were cancelled, so
  # this is prevention rather than a fix for something observed. It costs one
  # runner slot in the case it protects.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast gate, and the same command a contributor runs before opening a
  # pull request. Seconds, not minutes: doc 10 §8 warns that a check which
  # runs everything before every change ends up switched off.
  #
  # `pnpm verify` also carries doc 10 §3's PACKAGE layer now — it builds the
  # package and runs publint, attw and the weight budgets against it. That row
  # of §3's table had nothing behind it until 2026-09-11, and it found two
  # consumer-facing defects on its first run: four components published with no
  # CSS, and a type surface that silently became `any` under Node's own module
  # resolution (decision 0025). It belongs here rather than in the browser job
  # because §3 prices it at "Fast", and measured, it is about fifteen seconds.
  #
  # DO NOT RENAME EITHER JOB. Both `name:` values are required status checks in
  # this repository's branch protection, matched as exact strings — a rename
  # silently stops a check from being required, and that list is not visible
  # from any file here. It is not a hypothetical: the job below was renamed in
  # 114cb2d, from "Browser checks against the catalog" to its present name.
  # Add to a job rather than renaming it, or update the setting in the same
  # change.
  verify:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    # Measured at 1m49s on 2026-09-11. The default is SIX HOURS, so a job that
    # hangs — a wait that never resolves, a registry that never answers —
    # occupies a runner for a working day before anybody is told.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The slow layer, in its own job so it never delays the fast one.
  #
  # It exists because several core guarantees cannot be checked without a
  # browser. jsdom does not resolve CSS variables, does not implement real tab
  # order, and applies no stylesheet — so it can answer neither "what colour
  # did this end up", nor "where did focus go", nor "which mark is showing".
  # Every one of those has caught a real defect here.
  browser:
    name: Browser checks, accessibility and visual regression
    runs-on: ubuntu-latest
    # Measured at 11m52s on 2026-09-11, of which 11m0s is the three suites.
    # Generous rather than tight: this bounds a hang, it does not police a
    # duration (doc 10 §11 — a check on how long a suite took is a check on
    # how loaded the machine was).
    timeout-minutes: 45
    # Runs in the same image the baselines were generated in, so a screenshot
    # taken here is byte-identical to one taken locally through
    # apps/catalog/docker-visual.sh. That is what lets the pixel tolerance stay
    # at zero — see that script for why a tolerance would defeat the purpose.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The catalog renders the built stylesheet, exactly as a consumer does,
      # and the checks are served from the BUILT catalog rather than from a dev
      # server — so both builds come first, once, for the three suites below.
      #
      # The catalog build takes about ten seconds and buys two things. A dev
      # server compiles each story the first time it is asked for, which has
      # timed a story out three times in this repository under load; and
      # nothing left to compile is what makes running the suites in parallel
      # safe rather than a way to produce more of those timeouts.
      - name: Build the package and the catalog
        run: pnpm build:catalog

      # The three suites are three steps rather than one command, so a failure
      # says which layer failed in the job's own log. They no longer overlap:
      # the accessibility suite is its own project, and until this run it was
      # ALSO part of the behaviour checks — so its 357 story checks ran twice
      # per pipeline, for one set of results.
      #
      # Measured on the way in, and the reason this job was the long pole:
      #
      #   behaviour     · 7.5m serial → 2.7m
      #   accessibility · 13.1m       → 4.6m, and it ran twice
      #   visual        · 4.8m, one worker on purpose
      #
      # Playwright defaults to ONE worker when CI is set, so every one of those
      # serial numbers was what this job actually paid. `workers` is now
      # explicit in the config, which is where the rest of the reasoning is.
      #
      # AND THOSE ARE LOCAL NUMBERS, which is worth knowing before using them
      # to plan anything about this job. Measured HERE on 2026-09-11, on the
      # same commit: behaviour 3.3m, accessibility 5.4m, visual 2.3m, which is
      # 11m0s of the job's 11m52s. A CI runner has fewer cores than the machine
      # the local figures came from, so the two parallel suites are SLOWER here
      # and the single-worker one is FASTER -- which no amount of reading the
      # local numbers would have predicted. Doc 10 section 12: a duration is a
      # measurement of a machine, so it carries the machine and the date or it
      # says nothing.
      - name: Behaviour checks
        run: pnpm --filter catalog test:e2e

      # Doc 06 §5 is clear that this layer catches "a small fraction" and is a
      # cheap filter rather than a guarantee. It earns its place anyway: it
      # found a filled danger button at 3.91:1 against a 4.5:1 requirement,
      # which had been in the catalog since the first component.
      - name: Automated accessibility
        run: pnpm --filter catalog test:a11y

      # Doc 10 §6: the safety net that says WHICH components changed appearance
      # after a token edit. Demonstrated rather than assumed — changing one
      # radius token failed 13 of 19 baselines and left 6 untouched.
      - name: Visual regression
        run: pnpm --filter catalog test:visual

      # The diff images are the whole point of a visual failure: a report that
      # says "13 differ" without showing them is unactionable.
      #
      # This step uploaded NOTHING until 2026-09-10, and the comment above is
      # what made it look finished. No reporter was configured, so Playwright
      # used its default -- list locally, dot on CI -- and neither writes a
      # report, so `playwright-report/` never existed. The config now asks for
      # the html reporter on CI, and both paths are uploaded: the report to
      # browse and the raw actual/diff PNGs to open directly.
      #
      # It cost what the comment predicted: `avatar-states` failed at 289
      # pixels on a branch that changed no pixel, and the artefact that would
      # have said why was not there.
      # AND THE ARTEFACT IS VERIFIED, NOT THE STEP. Doc 10 §11.6 is about this
      # exact upload: it ran on every failure for months, uploaded nothing,
      # and said nothing, because an upload of a missing path is a warning
      # rather than an error. The reporter was fixed on 2026-09-10 and
      # verified once, by hand, which is the same standing the comment below
      # had before it turned out to be false.
      #
      # So this runs before the upload and fails if the report is not there.
      # It also PRINTS what the upload is about to take: a log line survives a
      # broken upload action, an expired artefact and a retention window, and
      # is the only copy of the evidence that does.
      - name: The failure has pictures to ship
        if: failure()
        working-directory: apps/catalog
        run: |
          set -u
          report=playwright-report/index.html
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty, so this failure ships no report."
            echo "Playwright's reporter is configured in apps/catalog/playwright.config.ts;"
            echo "on CI it must include ['html', { open: 'never' }]. Doc 10 §11.6."
            exit 1
          fi
          echo "$report exists, $(wc -c < "$report") bytes"
          echo "--- images the visual suite produced, which are the whole point of a pixel failure ---"
          find test-results -name '*.png' -type f | sort | while read -r png; do
            echo "$(wc -c < "$png") bytes  $png"
          done
          echo "--- end ---"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/catalog/playwright-report/
            apps/catalog/test-results/
          if-no-files-found: warn
          retention-days: 7
