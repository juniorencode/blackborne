name: Component request
description: Propose a component or a capability for the library.
labels: [component-request]
body:
  - type: markdown
    attributes:
      value: |
        A component enters the library when **two real consumers** need it.
        One is not enough — with one you do not generalise, you just move code.

        Asking with only one consumer is still worth doing: the request stays
        open as a signal until a second one appears. Nothing gets rejected for
        being early.

  - type: input
    id: name
    attributes:
      label: What is it
      description: A name that mentions no business domain.
      placeholder: 'Accordion'
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Who needs it
      description: >
        Name the real places that use it today, and what each does with it.
        "It would be useful" is not a consumer.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: >
        The most useful field in this form. How the need is met right now
        usually reveals whether this is a new component or a missing prop on an
        existing one.
    validations:
      required: true

  - type: checkboxes
    id: gate
    attributes:
      label: Does it clear the obvious bars?
      options:
        - label: Its name mentions no business entity
        - label: It does not need to know where its data comes from
        - label: It makes sense in an application neither of us has written yet
