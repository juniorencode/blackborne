name: Component or capability request
description: Propose a component, a prop or a variant for the library.
labels: [component-request]
body:
  - type: markdown
    attributes:
      value: |
        Two very different things get proposed through this form, and they are
        judged differently.

        **A new component** is a decision about the catalog. It sits apart, and
        if it turns out to be a mistake it can be deprecated away. Propose one
        freely.

        **A new prop or variant on a component that already exists** is a
        heavier ask. It lives on something people use, and removing it later
        costs a major version. It needs a real place that needs it today — not
        one that can be imagined.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this
      options:
        - A new component
        - A new prop or variant on an existing component
        - Not sure
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: What is it
      description: A name that mentions no business domain.
      placeholder: 'Accordion'
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What needs it, today
      description: >
        The real place this is for. For a new prop this is the important field:
        "would be useful" is where components go to rot.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: >
        The most useful field on this form. How the need is met right now
        usually reveals whether this is a new component or a missing prop on
        one that already exists — and those have very different costs.
    validations:
      required: true

  - type: checkboxes
    id: gate
    attributes:
      label: Does it clear the obvious bars?
      options:
        - label: Its name mentions no business entity
        - label: It does not need to know where its data comes from
        - label: It makes sense in an application neither of us has written yet
